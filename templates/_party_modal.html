{# Add/Edit modal for customers or suppliers. Usage: {% include %} after setting party, new_action #}
<div class="modal fade entity-modal" id="partyModal" tabindex="-1" data-new-action="{{ new_action }}"><div class="modal-dialog"><form method="post" class="modal-content">{{ csrf_input() }}
 <div class="modal-header"><h5 class="modal-title"><span class="t">Add</span> {{ party }}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body row g-2">
  <div class="col-12"><label class="form-label">Name *</label><input class="form-control" name="name" required maxlength="120"></div>
  {% if party == 'supplier' %}<div class="col-12"><label class="form-label">Company</label><input class="form-control" name="company" maxlength="120"></div>{% endif %}
  <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" maxlength="30" placeholder="0300 1234567"></div>
  <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" maxlength="120"></div>
  <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" maxlength="255"></div>
  <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="2" maxlength="1000"></textarea></div></div>
 <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div></form></div></div>
